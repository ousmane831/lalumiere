services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lumiere
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: lumiere_dev
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumiere"]
      interval: 5s
      retries: 10
  backup:
    # Sauvegarde quotidienne de la base (14 jours + 4 semaines conservés) dans ./backups
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: lumiere
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: lumiere_dev
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "4"
    volumes: ["./backups:/backups"]
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    environment:
      DEBUG: "1"
      DB_NAME: lumiere
      DB_USER: lumiere
      DB_PASSWORD: lumiere_dev
      DB_HOST: db
    volumes: [media:/app/media]
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      API_PROXY: http://backend:8000
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  pgdata:
  media:
